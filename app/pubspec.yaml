name: rwanda_school_book_scanner
description: Scan individual books for Rwandan school libraries and export records to Excel.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
